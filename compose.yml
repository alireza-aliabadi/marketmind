name: marketmind
services:
  postgres:
    profile: ["infra"]
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketmind}
      POSTGRES_USER: ${POSTGRES_USER:-alireza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - postgers_data:/var/lib/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    
  redis:
    profile: ["infra"]
    image: redis:7-alpine
    container_name: marketmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 8

  kafka:
    profile: ["infra"]
    image: apache/kafka:4.4.0
    restart: unless-stopped
    container_name: marketmind-kafka
    ports:
      - "9092:9092"
    environment:
      # Node Roles & KRaft settings
      KAFKA_NODE_ID: 1             
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER 
          
      # Listeners (Internal: 29092 for other containers, External: 9092 for host)
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093    
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    
      # Development settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1           
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: marketmind-kafka-ui
    restart: unless-stopped 
    ports:
      - "8080:8080"
    environment:   
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  neo4j:
    profile: ["infra"]
    image: neo4j:5.26
    container_name: marketmind-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me-local}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USERNAME:-neo4j} -p $${NEO4J_PASSWORD:-change-me-local} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 8
      
  aistor:
    image: quay.io/minio/aistor/minio:latest
    container_name: marketmind-aistor
    restart: unless-stopped
    profile: ["infra"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alireza}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local}
    volumes:
      - aistor_data:/mnt/data
      - ./minio.license:/minio.license:ro
    command: >
      server /mnt/data
      --console-address ":9001"
      --license /minio.license

  volumes:
  postgres_data:
  redis_data:
  kafka_data:
  neo4j_data:
  aistor_data:
