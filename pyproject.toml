[project]
name = "marketmind-api"
version = "0.1.0"
description = "MarketMind AI - initial platform API service"
requires-python = ">=3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "structlog",
  "neo4j>=6.4.1",
]

[project.scripts]
marketmind-api = "src.presentation.http.__main__:main"
graph-setup = "knowledge_graph_service.presentation.setup:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
  "mypy",
  "jsonschema[format-nongpl]",
  "openapi-spec-validator",
  "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "services/knowledge-graph-service/knowledge_graph_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.14"
strict = true
