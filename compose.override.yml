# Docker Compose loads these development-only host bindings automatically.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
  kafka:
    ports:
      - "127.0.0.1:9092:9092"
  kafka-ui:
    ports:
      - "127.0.0.1:8081:8080"
  neo4j:
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
  aistor:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
